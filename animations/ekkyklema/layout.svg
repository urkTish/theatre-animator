<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Ekkyklema layout (Stage 3 draft)</title>
  <style>
    .bg{fill:#f4efe6}
    .ink{stroke:#1d1a17;stroke-width:2;fill:none}
    .wood{fill:#8a5a34;stroke:#1d1a17;stroke-width:2}
    .deck{fill:#c49a6c;stroke:#1d1a17;stroke-width:2;stroke-dasharray:8 5}
    .deckghost{fill:#c49a6c;fill-opacity:.35;stroke:#1d1a17;stroke-width:1.5;stroke-dasharray:8 5}
    .wheel{fill:#1d1a17}
    .ground{fill:#d9d2c3;stroke:#1d1a17;stroke-width:1.5}
    .door{fill:#3a2a1c;stroke:#1d1a17;stroke-width:2}
    .doorR{fill:#5b4330;stroke:#1d1a17;stroke-width:2;stroke-dasharray:8 5}
    .clay{fill:#c8743c;stroke:#1d1a17;stroke-width:1.5}
    .hand{fill:#2b2723}
    .alt{fill:none;stroke:#7a4f8c;stroke-width:2;stroke-dasharray:2 5}
    .arrow{stroke:#2f5d73;stroke-width:3;fill:none;marker-end:url(#ah)}
    .lbl{font-size:15px;fill:#1d1a17}
    .lblA{font-size:15px;fill:#2f5d73;font-weight:600}
    .lblAlt{font-size:14px;fill:#7a4f8c;font-style:italic}
    .h{font-size:20px;font-weight:700;fill:#1d1a17}
    .sm{font-size:12.5px;fill:#4a433c}
    .greek{font-family:'GFS Didot',Georgia,serif;font-style:italic}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d73"/></marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8a5a34" stroke-width="2"/></pattern>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <!-- ============ PANEL 1: FRONT ELEVATION (60 px = 1 m) ============ -->
  <text class="h" x="40" y="44">1 · Front elevation: what the audience sees</text>
  <text class="sm" x="40" y="64">Scale 60 px = 1 m · platform shown rolled OUT</text>
  <!-- ground -->
  <rect class="ground" x="40" y="520" width="740" height="30"/>
  <text class="sm" x="50" y="542">orchestra (beaten earth) · no raised stage [R3]</text>
  <!-- skene facade 12 m wide x 5 m high (wooden) -->
  <rect class="wood" x="50" y="220" width="720" height="300" fill-opacity=".9"/>
  <g stroke="#1d1a17" stroke-width="1" opacity=".35">
    <line x1="50" y1="250" x2="770" y2="250"/><line x1="50" y1="490" x2="770" y2="490"/>
    <line x1="170" y1="250" x2="170" y2="490"/><line x1="290" y1="250" x2="290" y2="490"/>
    <line x1="530" y1="250" x2="530" y2="490"/><line x1="650" y1="250" x2="650" y2="490"/>
  </g>
  <!-- central doorway 2.8 m x 3.2 m, open -->
  <rect x="326" y="328" width="168" height="192" fill="#2a1f16" stroke="#1d1a17" stroke-width="2" stroke-dasharray="8 5"/>
  <!-- platform out: 2.4 m wide, 0.3 m high, front face -->
  <rect class="deck" x="338" y="490" width="144" height="18"/>
  <circle class="wheel" cx="352" cy="513" r="7"/><circle class="wheel" cx="468" cy="513" r="7"/>
  <!-- couch + reclining masked figure -->
  <rect class="clay" x="360" y="462" width="100" height="14" fill="#8a5a34"/>
  <rect x="364" y="476" width="6" height="14" fill="#1d1a17"/><rect x="450" y="476" width="6" height="14" fill="#1d1a17"/>
  <path class="clay" d="M372,462 q10,-26 30,-30 l40,8 q10,4 6,22 z"/>
  <circle class="clay" cx="392" cy="422" r="15"/>
  <ellipse cx="386" cy="428" rx="4" ry="3" fill="#1d1a17"/>
  <!-- standing actor on ground -->
  <g transform="translate(560,0)">
    <circle class="clay" cx="0" cy="408" r="15"/><path class="clay" d="M-14,424 L14,424 L20,520 L-20,520 z"/>
  </g>
  <!-- labels -->
  <text class="lbl" x="100" y="300">skene: wooden stage building [I]</text>
  <text class="lbl" x="100" y="320">façade = the house</text>
  <line class="ink" x1="494" y1="340" x2="560" y2="212" stroke-width="1"/>
  <text class="lbl" x="520" y="206">central door ~2.8 m [R2]</text>
  <line class="ink" x1="482" y1="500" x2="610" y2="560" stroke-width="1"/>
  <text class="lbl" x="560" y="580">platform, rolled out [R1]</text>
  <text class="lbl" x="300" y="598">tableau: figure on couch [R5]</text>
  <text class="sm" x="300" y="616">Pollux's "seat"; Agathon's couch, Thesm. 261 [A]</text>

  <!-- ============ PANEL 2: SIDE SECTION (60 px = 1 m) ============ -->
  <text class="h" x="820" y="44">2 · Cutaway side section through the central door</text>
  <text class="sm" x="820" y="64">Scale 60 px = 1 m · solid = IN (start) · dashed ghost = OUT</text>
  <rect class="ground" x="820" y="520" width="740" height="30"/>
  <text class="sm" x="840" y="542">backstage (inside the skene)</text>
  <text class="sm" x="1340" y="542">orchestra → audience</text>
  <!-- skene wall: roof + wall above door -->
  <rect class="wood" x="840" y="220" width="280" height="18"/>
  <rect class="wood" x="1102" y="220" width="18" height="108"/>
  <text class="lbl" x="860" y="210">skene roof (actors could appear here)</text>
  <!-- door leaf swung inward (R6) -->
  <text class="lbl" x="880" y="318">door leaf, open inward [R6]</text>
  <rect class="doorR" x="1018" y="330" width="84" height="188" fill-opacity=".35"/>
  <!-- platform IN: 1.6 m deep -->
  <g transform="translate(-67,0)">
  <rect class="deck" x="990" y="490" width="96" height="18"/>
  <circle class="wheel" cx="1002" cy="513" r="7"/><circle class="wheel" cx="1074" cy="513" r="7"/>
  <rect x="1000" y="470" width="70" height="10" fill="#8a5a34" stroke="#1d1a17"/>
  <circle class="clay" cx="1018" cy="452" r="12"/><path class="clay" d="M1010,470 q6,-12 20,-12 l30,4 l0,8 z"/>
  </g>
  <!-- platform OUT ghost (moved 2.9 m: front edge 1.25 m beyond the facade) -->
  <rect class="deckghost" x="1098" y="490" width="96" height="18"/>
  <circle cx="1110" cy="513" r="7" fill="none" stroke="#1d1a17" stroke-dasharray="3 3"/>
  <circle cx="1182" cy="513" r="7" fill="none" stroke="#1d1a17" stroke-dasharray="3 3"/>
  <path class="arrow" d="M975,580 L1150,580"/>
  <text class="lblA" x="1000" y="604"><tspan class="greek">ekkyklein</tspan> roll out → ~2.9 m in ~4 s</text>
  <path class="arrow" d="M1150,630 L975,630"/>
  <text class="lblA" x="1000" y="654">← <tspan class="greek">eiskyklein</tspan> roll back in (Thesm. 265)</text>
  <!-- stagehands pushing -->
  <g class="hand" transform="translate(-70,0)">
    <circle cx="955" cy="452" r="11"/><path d="M944,463 L966,463 L984,500 L976,520 L948,520 z"/>
    <path d="M966,470 L990,492" stroke="#2b2723" stroke-width="7"/>
    <circle cx="912" cy="460" r="11"/><path d="M901,471 L923,471 L936,520 L900,520 z"/>
  </g>
  <text class="lbl" x="836" y="400">stagehands push,</text><text class="lbl" x="836" y="420">unseen [R4]</text>
  <!-- alt: windlass ghost -->
  <circle class="alt" cx="832" cy="500" r="9"/>
  <path class="alt" d="M841,500 L1150,500"/>
  <circle class="alt" cx="1156" cy="500" r="6"/>
  <text class="lblAlt" x="1190" y="470">alt: windlass + pulley (Casanova 2017)</text>
  <text class="lbl" x="1220" y="380">wheels [I]: scholia</text>
  <text class="lbl" x="1220" y="400">on Ach. 408</text>
  <text class="sm" x="1220" y="420">4 solid wheels, ~0.3 m deck [R1]</text>

  <!-- ============ PANEL 3: PLAN (30 px = 1 m) ============ -->
  <text class="h" x="40" y="660">3 · Plan from above</text>
  <text class="sm" x="40" y="678">Scale 30 px = 1 m</text>
  <rect x="250" y="650" width="300" height="110" fill="#e3d6c3" stroke="#1d1a17" stroke-width="1"/>
  <text class="sm" x="258" y="668">backstage</text>
  <!-- facade wall with door gap -->
  <rect class="wood" x="190" y="760" width="168" height="9"/>
  <rect class="wood" x="442" y="760" width="168" height="9"/>
  <!-- platform in / out -->
  <rect class="deck" x="364" y="662" width="72" height="48"/>
  <rect class="deckghost" x="364" y="759" width="72" height="48"/>
  <path class="arrow" d="M470,680 L470,800"/>
  <!-- alt: turntable semicircle -->
  <path class="alt" d="M358,764 A42,42 0 0 0 442,764"/>
    <text class="lblAlt" x="490" y="800">alt: turntable pivoting</text><text class="lblAlt" x="490" y="818">in the doorway (Exon 1900;</text><text class="lblAlt" x="490" y="836">Flickinger 1918)</text>
  <!-- orchestra arc -->
  <path d="M120,880 Q400,800 680,880" fill="none" stroke="#1d1a17" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="sm" x="590" y="852">edge of orchestra</text>
  <text class="lbl" x="620" y="770">façade</text>
  <text class="sm" x="40" y="804">platform 2.4 × 1.6 m [R1]</text>
  <text class="sm" x="40" y="822">(estimates: 2.55 × 1.3 m Dearden; ~3 m wide Haigh)</text>

  <!-- ============ LEGEND ============ -->
  <rect x="820" y="690" width="740" height="190" fill="#fbf8f2" stroke="#1d1a17" stroke-width="1"/>
  <text class="h" x="840" y="722">Evidence code</text>
  <rect x="840" y="740" width="44" height="22" class="wood"/>
  <text class="lbl" x="896" y="756">[A] Attested: an ancient text says so</text>
  <rect x="840" y="772" width="44" height="22" fill="#e9b48a" stroke="#1d1a17" stroke-width="2"/>
  <text class="lbl" x="896" y="788">[I] Inferred: scholarly inference</text>
  <rect x="840" y="804" width="44" height="22" fill="url(#hatch)" stroke="#1d1a17" stroke-width="2" stroke-dasharray="8 5"/>
  <text class="lbl" x="896" y="820">[R] Reconstruction: our choice (R1–R6)</text>
  <rect x="840" y="836" width="44" height="22" class="alt"/>
  <text class="lbl" x="896" y="852">Alternative theory, shown as a ghost for comparison</text>
  <text class="sm" x="1330" y="756">Sources: Pollux 4.128;</text>
  <text class="sm" x="1330" y="774">Ar. Ach. 408–9, Thesm. 96, 265;</text>
  <text class="sm" x="1330" y="792">Haigh 1907; Casanova 2017.</text>
  <text class="sm" x="1330" y="810">Draft layout, not final art.</text>
</svg>
