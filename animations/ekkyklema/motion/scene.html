<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ekkyklema Roll-out</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: 'Inter'; src: url('fonts/Inter.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'GFS Didot'; src: url('fonts/GFSDidot.ttf') format('truetype'); font-weight: 400; font-display: block; }
  :root {
    --ink: #1d1a17; --clay: #c8743c; --sky: #f4efe6; --accent: #2f5d73; --wood: #8a5a34;
    --muted: #5d544b;
  }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  body.transparent, html:has(body.transparent) { background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--ui, 1)); pointer-events: none; font-family: 'Inter', sans-serif; color: var(--ink); }

  /* chapter card, top left */
  .card { position: absolute; left: 56px; top: 50px; padding: 20px 28px 20px 24px; background: rgba(244, 239, 230, 0.86);
          border-radius: 12px; box-shadow: 0 10px 34px rgba(20, 14, 8, 0.22), 0 1px 0 rgba(255,255,255,0.6) inset;
          border-left: 4px solid var(--clay); opacity: 0; }
  .card .row { white-space: nowrap; }
  .card .r1 { font-size: 15px; font-weight: 650; letter-spacing: 0.16em; display: flex; align-items: baseline; gap: 10px; }
  .card .counter { color: var(--clay); font-variant-numeric: tabular-nums; }
  .card .dot { color: rgba(29, 26, 23, 0.35); }
  .card .name { color: var(--ink); font-weight: 760; letter-spacing: 0.14em; }
  .card .r2 { margin-top: 12px; font-size: 31px; line-height: 1.1; }
  .card .translit { font-family: 'GFS Didot', serif; font-style: italic; }
  .card .greek { font-family: 'GFS Didot', serif; color: #3d342c; margin-left: 4px; }
  .card .gloss { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 450; color: var(--muted); margin-left: 8px; }
  .card .r3 { margin-top: 12px; font-size: 14px; font-weight: 520; color: var(--muted); letter-spacing: 0.02em; }
  .card .r3 i { font-style: italic; }

  /* "How sure?" gauge, right edge */
  .gauge { position: absolute; right: 44px; top: 318px; width: 214px; padding: 18px 20px 18px 18px; background: rgba(244, 239, 230, 0.80);
           border-radius: 12px; box-shadow: 0 10px 30px rgba(20, 14, 8, 0.18); opacity: 0; }
  .gtitle { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 16px; }
  .gtrack { position: relative; height: 196px; margin-right: 18px; }
  .gline { position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: var(--ink); border-radius: 1px; }
  .gtick { position: absolute; right: -8px; width: 100%; transform: translateY(-50%); text-align: right; padding-right: 26px; box-sizing: border-box; }
  .gtick::after { content: ''; position: absolute; right: 0; top: 50%; width: 18px; height: 2px; background: var(--ink); }
  .gtick.t0 { top: 0%; } .gtick.t1 { top: 50%; } .gtick.t2 { top: 100%; }
  .glab { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; }
  .gsub { display: block; font-size: 11px; font-weight: 450; color: #7a6f64; margin-top: 2px; }
  .gmarker { position: absolute; right: 1px; top: 0; width: 0; height: 0; }
  .gmarker i { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--clay);
               box-shadow: 0 0 0 4px rgba(200, 116, 60, 0.25); }
  .gmarker i::after { content: ''; position: absolute; left: 18px; top: -2px; border-style: solid; border-width: 9px 14px 9px 0; border-color: transparent var(--clay) transparent transparent; }
  .gtick.t1 .glab { color: var(--clay); }
  .gnote { margin-top: 22px; padding-top: 12px; border-top: 1px solid rgba(29, 26, 23, 0.15); font-size: 13px; line-height: 1.5; font-weight: 500; }

  /* breadcrumb outline */
  .crumb { position: absolute; left: 0; top: 0; opacity: 0; overflow: visible; }
  .crumb .cglow { fill: none; stroke: var(--accent); stroke-width: 7; stroke-opacity: 0.45; stroke-linejoin: round; }
  .crumb .cline { fill: rgba(47, 93, 115, 0.06); stroke: #6fa3ba; stroke-width: 2; stroke-linejoin: round; }
  .crumbLabel { position: absolute; transform: translateX(-50%); background: var(--accent); color: var(--sky); font-size: 14px; font-weight: 600;
                letter-spacing: 0.04em; padding: 5px 11px 6px; border-radius: 7px; opacity: 0; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,0.3); }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="overlay"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
