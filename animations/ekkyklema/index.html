<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const TOTAL = 90;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, u) => a + (b - a) * u;
const E = {
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  sine: u => -(Math.cos(Math.PI * u) - 1) / 2,
  lin: u => u,
};
const r2 = n => Math.round(n * 100) / 100;
/* keyed value track: piecewise, eased between keys; pure in t */
function track(t, keys, ease = E.io) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
      return t1 === t0 ? v1 : lerp(v0, v1, ease((t - t0) / (t1 - t0)));
    }
  }
  return keys[keys.length - 1][1];
}
/* visibility window: fully on in [a,b], fades over f outside it */
function win(t, a, b, f = .35) {
  if (t < a - f || t > b + f) return 0;
  if (t < a) return E.sine((t - (a - f)) / f);

function richSVG(parent, str) {
  for (const part of str.split(/(\*[^*]+\*|_[^_]+_|\{[^}]+\})/g)) {
    if (!part) continue;
    if (part[0] === '*') el('tspan', { 'font-style': 'italic' }, parent).textContent = part.slice(1, -1);
    else if (part[0] === '_') el('tspan', { class: 'gk' }, parent).textContent = didot(part.slice(1, -1));
    else if (part[0] === '{') el('tspan', { class: 'tag' }, parent).textContent = ' [' + part.slice(1, -1) + ']';
    else parent.appendChild(document.createTextNode(part));
  }
}
function richHTML(str) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return str.split(/(\*[^*]+\*|_[^_]+_)/g).map(p => !p ? '' :
    p[0] === '*' ? `<em>${esc(p.slice(1, -1))}</em>` :
    p[0] === '_' ? `<span class="gk">${esc(didot(p.slice(1, -1)))}</span>` : esc(p)).join('');
}
const labelObjs = LABELS.map(spec => {
  const parent = $(spec.p + '-labels');
  const o = { spec };
  if (spec.imark) {
    o.g = el('g', { class: 'imark', opacity: 0 }, parent);
    o.c = el('circle', {}, o.g); o.tx = el('text', {}, o.g); o.tx.textContent = 'I';
    return o;
  }
  o.g = el('g', { class: 'lbl' + (spec.cls ? ' ' + spec.cls : ''), opacity: 0 }, parent);
  o.leader = el('path', { class: 'leader' }, o.g);
  o.dot = el('circle', { class: 'leaderdot' }, o.g);
  o.plate = el('rect', { class: 'plate' }, o.g);
  o.text = el('text', {}, o.g);
  o.mode = null;
  return o;
});
function specFor(o, mode) { return mode === 'tall' && o.spec.tall ? Object.assign({}, o.spec, o.spec.tall) : o.spec; }
function buildLabelText(o, sp) {
  o.text.textContent = '';
  o.tspans = sp.lines.map(line => {
    const sec = line[0] === '^';
    const ts = el('tspan', sec ? { class: 'sec' } : {}, o.text);
    richSVG(ts, sec ? line.slice(1) : line);
    return ts;
  });
  o.g.classList.toggle('plated', !!sp.plate);
}

  $('playicon').innerHTML = playing ? '<path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/>' : '<path d="M4 2.5v11l9.5-5.5z"/>';
}
$('play').addEventListener('click', toggle);
$('bigplay').addEventListener('click', () => { play(); $('play').focus({ preventScroll: true }); });
$('prev').addEventListener('click', () => stepBeat(-1));
$('next').addEventListener('click', () => stepBeat(1));
scrub.addEventListener('input', () => { setT(parseFloat(scrub.value)); lastTs = null; });
document.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); if (!e.repeat) toggle(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepBeat(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBeat(-1); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space' || e.key === ' ') e.preventDefault(); });

/* ---------------- responsive mode ---------------- */
const app = $('app');
function applyMode() {
  const avail = app.clientWidth - parseFloat(getComputedStyle(app).paddingLeft) - parseFloat(getComputedStyle(app).paddingRight);
  const m = avail < 720 ? 'tall' : 'wide';
  if (m !== mode) {
    mode = m; stage.dataset.mode = m;
    const M = MODES[m];
    svg.setAttribute('viewBox', `0 0 ${M.W} ${M.H}`);
    for (const id of ['stbg', 'glow']) set($(id), { width: M.W, height: M.H });
  }
  document.documentElement.style.setProperty('--stage-w', stage.getBoundingClientRect().width + 'px');
  needsRender = true; requestFrame();
}
if (window.ResizeObserver) new ResizeObserver(applyMode).observe(app); else addEventListener('resize', applyMode);
applyMode();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const P in panels) panels[P].twKey = ''; needsRender = true; requestFrame(); });
render(t);
updatePlayUI();

/* small hook for testing and embedding */
window.ekkyklema = { seek: s => { setT(s); render(t); }, play, pause, get t() { return t; }, get mode() { return mode; }, beats: BEATS };
})();
</script>
